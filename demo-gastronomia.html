<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Demo en vivo de OdinGO Resto-Roti. Probá mesas, cocina KDS y delivery con datos de ejemplo.">
<title>OdinGO Resto-Roti - Demo en vivo</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
body{margin:0}
.demobar{background:#010811;color:#e2e8f0;font-size:.78rem;padding:8px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.08)}
.demobar a{color:#66ddd5}
.demobar .tleft{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.keybtn{background:rgba(24,170,165,.15);border:1px solid #18aaa5;color:#66ddd5;border-radius:8px;padding:7px 12px;font-weight:800;font-size:13px;cursor:pointer}
.dmodal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.dbox{background:var(--bg-principal);padding:26px;border-radius:12px;width:min(420px,92vw);text-align:center;border:1px solid var(--border-card)}
.dbox input{width:100%;padding:12px;font-size:1.1rem;text-align:center;letter-spacing:3px;margin:12px 0;background:var(--bg-card);border:1px solid var(--border-card);border-radius:8px;color:var(--text-titulos)}
#ds-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#10233e;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:.3s;z-index:60;border:1px solid rgba(24,170,165,.5)}
#ds-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.syscols{display:grid;grid-template-columns:1fr 1.4fr;gap:20px;margin-top:12px}
.syscols h5{color:#18aaa5;font-size:12px;margin:0 0 8px}
.syscols ul{margin:0;padding-left:18px;font-size:13px}
.syscols li{margin-bottom:5px}
.tophead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.buybtn{background:#18aaa5;color:#fff;border:none;border-radius:9px;padding:12px 20px;font-weight:800;font-size:14px;cursor:pointer}
@media(max-width:700px){.syscols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="demobar">
  <div class="tleft"><span>🧪 <b>DEMO</b> · datos de ejemplo, nada se guarda</span><a href="odingo.html">← Volver a OdinGO</a></div>
  <div class="tleft"><span id="lock-state">🔒 Demo limitada</span><button class="keybtn" onclick="DS.openKey()">🔑 Tengo clave</button></div>
</div>
<section style="padding:40px 0 90px;background:var(--bg-secundario);min-height:100vh">
  <div class="container">
    <div class="tophead">
      <div><div class="section-label">OdinGO · DEMO EN VIVO 🍕</div><h2 id="sys-title" style="margin:0">Demo</h2></div>
      <div style="display:flex;gap:10px"><button class="link-btn" onclick="DS.reset()">🔄 Reiniciar demo</button><button class="buybtn" onclick="DS.buy()">Comprar esta licencia 🛒</button></div>
    </div>
    <div id="sys-info" style="margin:16px 0"></div>
    <div id="sys-kpis" class="demo-kpis"></div>
    <div id="sys-body" class="demo-body"></div>
    <p class="muted" style="margin-top:14px">🧪 Todo funciona en la memoria de esta página. Al recargar, vuelve a los datos de ejemplo.</p>
  </div>
</section>
<div id="modal"></div>
<script>window.DEMO_SYS = "gastronomia";</script>
<script src="demo-sistemas.js"></script>
</body>
</html>
