<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Demo en vivo de OdinGO POS Express para kioscos y comercios. Probá el punto de venta como si estuvieras en el mostrador.">
<title>OdinGO POS Express · Demo en vivo</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
/* Réplica visual del POS real (PRUEBAS/frontend) */
:root{
  --text:#1e293b; --text-h:#0f172a; --bg:#f1f5f9; --surface:#ffffff; --surface2:#f8fafc;
  --border:#cbd5e1; --border-soft:#e2e8f0; --muted:#64748b; --placeholder:#94a3b8;
  --input-bg:#ffffff; --input-text:#0f172a;
  font:18px/145% system-ui,'Segoe UI',Roboto,sans-serif; letter-spacing:.18px;
  color-scheme:light; color:var(--text); background:var(--bg);
}
body[data-theme="dark"]{
  --text:#e2e8f0; --text-h:#f8fafc; --bg:#0b1220; --surface:#131e33; --surface2:#0d1628;
  --border:#2b3b58; --border-soft:#22304a; --muted:#94a3b8; --placeholder:#64748b;
  --input-bg:#0d1628; --input-text:#f1f5f9; color-scheme:dark; color:var(--text); background:var(--bg);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
input,select,textarea{background:var(--input-bg)!important;color:var(--input-text)!important;border:1px solid var(--border)}
input::placeholder{color:var(--placeholder)!important;opacity:1}
#root{width:100%;max-width:1600px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column}
h2{font-size:24px;margin:0 0 8px;color:var(--text-h);font-weight:500}
h3{color:var(--text-h)} h4{color:var(--text-h)}
.topbar{background:#0f172a;color:#fff;padding:8px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h2{margin:0;font-size:1.1rem;color:#fff}
.topbar .rol{font-size:.65rem;color:#94a3b8}
.navbtn{padding:6px 12px;background:transparent;color:#fff;border:1px solid #475569;border-radius:4px;cursor:pointer;font-size:.85rem}
.navbtn.on{background:#334155}
.navbtn.key{border-color:#f59e0b;color:#fde68a}
.inp{padding:8px;border-radius:4px;border:1px solid var(--border);font-size:.9rem}
.minibtn{padding:4px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:.8rem;color:inherit}
.qtybtn{width:26px;height:26px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);cursor:pointer;font-weight:bold;color:inherit}
.card{background:var(--surface);padding:12px 16px;border-radius:8px;min-width:130px}
.msg{padding:8px 16px;font-weight:bold;font-size:.9rem}
.msg.ok{background:#dcfce7;color:#166534} .msg.err{background:#fee2e2;color:#991b1b}
.demobar{background:#0f172a;color:#e2e8f0;font-size:.78rem;padding:6px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid #334155}
.demobar a{color:#7dd3fc}
.demobar .tleft{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pos{display:grid;grid-template-columns:1.2fr 1fr;gap:15px;padding:15px;flex:1;overflow:hidden}
.panel{background:var(--surface);border-radius:8px;padding:15px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.searchrow{display:flex;gap:10px;align-items:center}
.searchrow input{flex:1;padding:10px;border-radius:6px;border:1px solid var(--border)}
.sug{border:1px solid var(--border-soft);border-radius:6px;overflow:hidden}
.sug div{padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--bg)}
.consult{background:var(--surface2);padding:10px;border-radius:6px;border:1px solid var(--border-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.85rem;font-weight:bold}
.hintline{font-size:.8rem;color:var(--muted)}
.gridprods{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start;min-height:200px}
.prod{background:var(--surface2);border:1px solid var(--border-soft);padding:10px;border-radius:6px;cursor:pointer;font-family:inherit;text-align:left;color:inherit}
.prod.nostock{background:#fef2f2;opacity:.6;cursor:not-allowed}
body[data-theme="dark"] .prod.nostock{background:#3f1d1d}
.prod .pn{font-weight:bold;font-size:.85rem}
.prod .pd{font-size:.7rem;color:var(--muted)}
.prod .pp{color:#16a34a;font-weight:bold;margin-top:5px}
.prod .tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.bdg{font-size:.65rem;padding:2px 5px;border-radius:3px;font-weight:bold}
.combo{background:#fffbeb!important;border:2px solid #f59e0b!important}
body[data-theme="dark"] .combo{background:#3a2c10!important}
.ticket{flex:1;overflow-y:auto;margin-top:8px}
table.t{width:100%;border-collapse:collapse}
table.t thead tr{background:var(--surface2);font-size:.78rem;text-align:left;position:sticky;top:0}
table.t td,table.t th{padding:6px;border-bottom:1px solid var(--bg);font-size:.85rem;color:var(--text)}
.totalbox{border-top:2px solid var(--border-soft);padding-top:10px}
.bigbtn{width:100%;padding:12px;background:#16a34a;color:#fff;border:none;border-radius:6px;font-weight:bold;font-size:1rem;cursor:pointer}
.bigbtn:disabled{background:var(--placeholder);cursor:not-allowed}
.view{padding:20px;overflow-y:auto}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:700px;background:var(--surface);padding:15px;border-radius:8px;margin-bottom:20px}
table.list{width:100%;border-collapse:collapse;background:var(--surface);border-radius:8px;overflow:hidden}
table.list thead tr{background:var(--surface2);text-align:left;font-size:.8rem}
table.list td,table.list th{padding:8px;border-bottom:1px solid var(--bg);font-size:.85rem}
.delbtn{padding:6px 12px;background:#dc2626;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold}
.lockbox{background:var(--surface);border:2px dashed #f59e0b;border-radius:10px;padding:26px;text-align:center;max-width:560px;margin:30px auto}
.lockbox .big{font-size:2rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{background:var(--surface);padding:24px;border-radius:10px;width:min(420px,92vw);text-align:center}
.modal input{width:100%;padding:12px;font-size:1.2rem;text-align:center;letter-spacing:4px;margin:12px 0}
/* Solicitud de acceso — diseño sobrio */
.rk-card{background:var(--surface);border-radius:14px;width:min(580px,94vw);max-height:92vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.35);border-top:4px solid #0f172a}
.rk-head{padding:22px 26px 0}
.rk-head h3{margin:0;font-size:1.05rem;color:var(--text-h)}
.rk-head p{margin:6px 0 0;font-size:.83rem;color:var(--muted)}
.rk-sec{padding:16px 26px;border-top:1px solid var(--border-soft);margin-top:16px}
.rk-sec:first-of-type{border-top:none;margin-top:0}
.rk-title{font-size:.72rem;font-weight:700;letter-spacing:1.2px;color:var(--muted);margin-bottom:12px}
.rk-row{display:flex;gap:10px}
.rk-field{flex:1;min-width:0;margin-bottom:10px}
.rk-field label{display:block;font-size:.75rem;font-weight:600;color:var(--text-h);margin-bottom:4px}
.rk-field label span{color:#dc2626}
.rk-field input,.rk-field select{width:100%;padding:9px 10px;border-radius:6px;font-size:.88rem}
.rk-field input:focus,.rk-field select:focus{outline:2px solid #0f172a;outline-offset:-1px}
.rk-actions{display:flex;gap:10px;margin-top:6px}
.rk-primary{flex:1;padding:11px;background:#0f172a;color:#fff;border:none;border-radius:6px;font-weight:700;font-size:.9rem;cursor:pointer}
.rk-ghost{padding:11px 18px;background:transparent;border:1px solid var(--border);border-radius:6px;font-size:.88rem;cursor:pointer;color:inherit}
.rk-note{font-size:.75rem;color:var(--muted);margin-top:10px;text-align:center}
@media(max-width:600px){.rk-row{flex-direction:column}}
#ticket-impresion{display:none}
@media print{
  body *{visibility:hidden}
  #ticket-impresion,#ticket-impresion *{visibility:visible}
  #ticket-impresion{display:block!important;position:absolute;left:0;top:0;width:80mm;font-family:'Courier New',monospace;font-size:12px;padding:5px;color:#000!important;background:#fff!important}
}
@media(max-width:900px){.pos{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="demobar">
  <div class="tleft"><span>🧪 <b>DEMO</b> · datos de ejemplo, nada se guarda</span><a href="odingo.html">← Volver a OdinGO</a></div>
  <div class="tleft"><span id="lock-state">🔒 Demo limitada</span><button class="navbtn key" onclick="DK.openKey()">🔑 Tengo clave</button></div>
</div>
<div id="root">
  <div class="topbar">
    <div><h2>OdinGO POS Express <span class="rol">demo (cajero)</span></h2><div id="kiosco-nombre" style="font-size:.72rem;color:#94a3b8">Mi Kiosco Demo</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center" id="mainnav"></div>
  </div>
  <div id="msg"></div>
  <div id="app" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
</div>
<div id="ticket-impresion"></div>
<div id="modal"></div>
<script src="demo-kiosco.js"></script>
</body>
</html>
