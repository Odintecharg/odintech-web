<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turno en el kiosco · Juego OdinTech</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#071526;color:#eef2f7;font-family:Inter,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:26px 5% 60px}
a.back{color:#5eead4;text-decoration:none;font-size:14px;font-weight:700}
h1{font-size:clamp(32px,6vw,56px);font-weight:900;letter-spacing:-2px;margin:10px 0 4px}
.sub{color:#9fb3c8;margin-bottom:20px}
.hud{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hud div{flex:1;min-width:140px;background:#ffffff0d;border:1px solid #ffffff22;border-radius:12px;padding:12px 16px;text-align:center}
.hud b{font-size:26px;display:block}
.hud small{font-size:11px;letter-spacing:2px;color:#9fb3c8}
.belt{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;min-height:150px}
.prod{background:#ffffff0d;border:1px solid #ffffff22;border-radius:14px;padding:22px 10px;font-size:44px;cursor:pointer;text-align:center;transition:transform .15s;animation:pop .35s cubic-bezier(.16,1,.3,1)}
.prod small{display:block;font-size:12px;margin-top:8px;color:#dbe4ee;font-weight:700}
.prod:active{transform:scale(.92)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.ticket{background:#fff;color:#111;border-radius:14px;padding:20px 22px;font-family:'Courier New',monospace;margin-bottom:18px}
.ticket h3{text-align:center;margin-bottom:8px}
.ticket .row{display:flex;justify-content:space-between;font-size:15px;padding:3px 0}
.ticket .tot{border-top:2px dashed #111;margin-top:8px;padding-top:8px;font-size:20px;font-weight:bold;display:flex;justify-content:space-between}
button.big{width:100%;padding:15px;border:none;border-radius:12px;background:#18aaa5;color:#fff;font-size:17px;font-weight:900;cursor:pointer}
button.big:disabled{background:#475569;cursor:not-allowed}
.payrow{display:flex;gap:10px;margin:14px 0}
.payrow input{flex:1;padding:13px;border-radius:10px;border:1px solid #ffffff33;background:#ffffff0d;color:#fff;font-size:16px}
.end{text-align:center;padding:30px 10px}
.end .t{font-size:64px}
@media(max-width:600px){.belt{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">← Volver</a>
<h1>Turno en el kiosco 🛒</h1>
<p class="sub">Tocá los productos para escanearlos. Meta: vender <b>$15.000</b> antes de que se acabe el tiempo. Después cobrás como un cajero de verdad.</p>
<div class="hud"><div><b id="h-t">60</b><small>SEGUNDOS</small></div><div><b id="h-v">$0</b><small>VENDIDO</small></div><div><b id="h-m">$15.000</b><small>META</small></div></div>
<div class="belt" id="belt"></div>
<div class="ticket"><h3>🧾 TICKET</h3><div id="t-items"><div class="row"><span>Aún nada escaneado…</span><span></span></div></div><div class="tot"><span>TOTAL</span><span id="t-t">$0</span></div></div>
<div class="payrow"><input id="paga" type="number" placeholder="El cliente paga con…"><button class="big" style="width:auto;padding:13px 26px" onclick="J.cobrar()">Cobrar</button></div>
<button class="big" onclick="J.start()" id="btn-start">▶ Empezar turno</button>
<div class="end" id="end" style="display:none"></div>
</div>
<script>
const J = (()=>{
const PRODS=[['🥤',1200,'Gaseosa'],['🍫',400,'Alfajor'],['🧉',2100,'Yerba'],['🍞',1800,'Pan kg'],['🧀',7500,'Queso'],['🍕',9500,'Pizza'],['☕',2900,'Café'],['🍬',300,'Chicle'],['🧴',1000,'Lavandina']];
const META=15000;let t=60,timer=null,items=[],total=0,done=false;
const $=id=>document.getElementById(id);
const fmt=n=>'$'+n.toLocaleString('es-AR');
function spawn(){
  if(done)return;
  const b=$('belt');b.innerHTML='';
  const n=3+Math.floor(Math.random()*2);
  const used=[...PRODS].sort(()=>Math.random()-.5).slice(0,n);
  used.forEach((p,i)=>{const d=document.createElement('div');d.className='prod';d.innerHTML=p[0]+`<small>${p[2]} · ${fmt(p[1])}</small>`;d.onclick=()=>scan(i);d._p=p;b.appendChild(d)});
}
function scan(i){
  if(done||!timer)return;
  const p=[...document.getElementById('belt').children][i]._p;
  items.push(p);total+=p[1];draw();spawn();
}
function draw(){
  $('h-v').textContent=fmt(total);
  $('t-t').textContent=fmt(total);
  $('t-items').innerHTML=items.map(p=>`<div class="row"><span>${p[0]} ${p[2]}</span><span>${fmt(p[1])}</span></div>`).join('')||'<div class="row"><span>Aún nada…</span><span></span></div>';
  if(total>=META)finish(true);
}
function start(){
  t=60;items=[];total=0;done=false;$('end').style.display='none';$('btn-start').disabled=true;draw();spawn();
  clearInterval(timer);
  timer=setInterval(()=>{t--;$('h-t').textContent=t;if(t<=0)finish(total>=META)},1000);
}
function cobrar(){
  if(done||!timer||!items.length){return}
  const paga=parseInt(($('paga').value||'0'),10);
  if(paga<total){alert('Falta plata: el total es '+fmt(total));return}
  finish(true,paga-total);
}
function finish(win,vuelto){
  done=true;clearInterval(timer);$('btn-start').disabled=false;
  const e=$('end');e.style.display='block';
  e.innerHTML=win
    ?`<div class="t">🎉</div><h2>¡Contratado como cajero!</h2><p>Vendiste ${fmt(total)}${vuelto?` · Vuelto ${fmt(vuelto)}`:''}. Esto es una probadita: el sistema real hace esto y mucho más.</p><br><a href="demo-kiosco.html" style="color:#5eead4;font-weight:800">Probar la demo real del kiosco →</a>`
    :`<div class="t">⏰</div><h2>Se acabó el turno</h2><p>Vendiste ${fmt(total)} de ${fmt(META)}. <a href="#" onclick="J.start();return false" style="color:#5eead4;font-weight:800">Probar de nuevo</a></p>`;
}
return{start,cobrar};
})();
</script>
</body>
</html>
